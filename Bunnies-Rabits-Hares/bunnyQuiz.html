<!DOCTYPE html>
<html lang="en">
  <link rel="stylesheet" href="style.css" />
  <head>

    <form id="quizForm">
      <div class="question">

      <div class="question">
        <p>
          2. What is the sweetest, cutest and most adorable of all the bunnies?
        </p>
        <label><input type="radio" name="q2" value="correct" /> Bunny</label>
        <label><input type="radio" name="q2" value="correct" /> Bunny.</label>
        <label><input type="radio" name="q2" value="correct" /> Bunny?</label>
        <label><input type="radio" name="q2" value="correct" /> Bunny!</label>
      </div>

      <div class="question">
        <p>3. What is the backbone of the rabbit-sphere?</p>
        <label><input type="radio" name="q3" value="a" /> The rabbit</label>
        <label><input type="radio" name="q3" value="b" /> The bunny</label>
        <label><input type="radio" name="q3" value="c" /> The hare</label>
        <label><input type="radio" name="q3" value="d" /> Roger Rabbit</label>
      </div>

      <div class="question">
        <p>4. Who is the diety of the bunny-folk?</p>
        <label
          ><input type="radio" name="q4" value="a" /> Boseidon of the Sea</label
        >
        <label><input type="radio" name="q4" value="b" /> Besus Brist</label>
        <label><input type="radio" name="q4" value="c" /> Ballah</label>
        <label
          ><input type="radio" name="q4" value="d" /> The Holy
          Hand-Grenade</label
        >
      </div>

      <div class="question">
        <p>5. Why did the bunny go to the hair salon?</p>
        <label
          ><input type="radio" name="q5" value="a" /> His hair was too
          long</label
        >
        <label
          ><input type="radio" name="q5" value="b" /> He needed a new
          rompadour</label
        >
        <label
          ><input type="radio" name="q5" value="c" /> Because he was having a
          bad hare day!</label
        >
        <label><input type="radio" name="q5" value="d" /> Dingleberries</label>
      </div>

      <button type="button" id="submitBtn">Submit Quiz!</button>

      <nav>
        <a href="index.html">home!</a>
      </nav>

    <div id="results"></div>

    <script src="bunnyQuiz.js"></script>

</html>
